schema: spec-driven

context: |
  Nook — "a home for my interests". A private, cross-platform (iOS/Android/web)
  personal hobby log. One app with swappable modules the user enables from their
  profile, instead of one app per hobby.

  Tech stack: Expo (React Native) + Expo Router, TypeScript, Supabase
  (Postgres + RLS + Auth + Storage + PostGIS), TanStack Query, Zod.

  Core architecture: all modules log into one shared domain — Entry (a
  timestamped event), Item (a reusable thing you own), Place, Media. Modules
  contribute only a payload schema, capture UI, and renderers via a registered
  manifest. Modules must never import each other; the shell must never branch on
  a module id. Payloads are JSONB by default; a module gains its own tables only
  when its analytics justify it.

  Privacy: everything is private by default. Visibility lives on the core Entry
  and is enforced by Postgres row-level security, never by module code.

  Planned modules: Coffee (first), Sports (second — the real test of the
  architecture), then Books, Art, Cooking. Personal project, possibly a product
  later; motivation is the scarce resource, so scope stays small and the first
  module ships genuinely usable.

